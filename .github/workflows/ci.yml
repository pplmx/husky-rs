name: CI # Continuous Integration

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable
                with:
                    components: rustfmt, clippy

            -   name: Cache Rust dependencies
                uses: Swatinem/rust-cache@v2

            -   name: Check formatting
                run: cargo fmt --all --check

            -   name: Clippy check
                run: cargo clippy --all-targets --all-features --workspace -- -D warnings

            -   name: Check documentation
                env:
                    RUSTDOCFLAGS: -D warnings
                run: cargo doc --no-deps --document-private-items --all-features --workspace

    msrv:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            -   name: Install Rust toolchain (MSRV)
                uses: dtolnay/rust-toolchain@stable
                with:
                    # NOTE: Keep in sync with rust-version in Cargo.toml
                    toolchain: "1.97"

            -   name: Cache Rust dependencies
                uses: Swatinem/rust-cache@v2

            -   name: Check MSRV
                run: cargo check --all-targets --all-features --workspace

    test:
        needs: [ lint, msrv ]
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]

        steps:
            -   uses: actions/checkout@v7

            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable

            -   name: Cache Rust dependencies
                uses: Swatinem/rust-cache@v2

            -   name: Run tests
                run: cargo test --all-features --workspace

    prek-e2e:
        needs: [ lint, msrv ]
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            -   name: Install Rust toolchain
                uses: dtolnay/rust-toolchain@stable

            -   name: Cache Rust dependencies
                uses: Swatinem/rust-cache@v2

            -   name: Install prek
                uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2
                with:
                    install-only: true
                    prek-version: 0.4.10

            -   name: Run real prek integration tests
                env:
                    PREK_E2E: "1"
                run: cargo test --test test_installation test_real_prek_

    deny:
        name: cargo-deny
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: Swatinem/rust-cache@v2
            -   name: Install cargo-deny
                uses: taiki-e/install-action@cargo-deny
            -   name: Run cargo-deny
                run: cargo deny check
